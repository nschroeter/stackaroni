[package]
name = "stackaroni-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = "0.36.1"
fs4 = "1.1.0"
rfd = "0.17.2"
stackaroni-core = { path = "../core" }

[dev-dependencies]
tempfile = "3.27.0"

# Process-liveness checks for reaping stale temp files. Platform-specific and flagged
# as CLAUDE.md asks: there is no portable "is this pid alive" in std, and the
# alternative — reaping purely by file age — would eventually delete the scratch of a
# run that is simply taking a long time.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Compiles `packaging/icon/stackaroni.ico` into the executable, so Explorer draws it for
# the .exe itself — see build.rs.
#
# Gated on `cfg(windows)`, which for a build-dependency means the *host*. That is the
# right gate here and not a mistake: the resource compiler it drives is `rc.exe` from the
# Windows SDK, so this only ever works on a Windows host anyway, and the release workflow
# builds each platform on its own runner rather than cross-compiling.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

# `muda` builds the menu bar; the two `objc2` crates are only there to keep AppKit from
# renaming the application menu back to the process name — see `retitle_app_menu`. Both
# are already in the tree via `eframe`, which reaches for AppKit the same way and for the
# same reason, so this adds versions rather than dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
