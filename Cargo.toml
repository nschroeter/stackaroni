[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "MIT"

# Numeric inner loops benefit disproportionately from cross-crate inlining, and the
# pipeline is one crate calling another (`filter::box_sum` from `focus`, `weights` and
# `fusion`) in its hottest paths. Costs compile time, changes no semantics: Rust does not
# reassociate or contract float operations without explicit permission, so the
# byte-identical output gate should hold across this — and if it does not, that is worth
# knowing rather than assuming.
[profile.release]
lto = "thin"
codegen-units = 1

# `opt-level = 0` makes a debug build unusable for real stacks, not merely slower: the
# ruler stack took 43 minutes against release's 261 s, a 9.9x gap, and that reads as a
# pipeline problem rather than as a missing `--release`. Level 2 rather than 3 keeps
# compile times reasonable, and `debug-assertions` and overflow checks stay on, so a
# debug build still fails loudly where a release build would not.
[profile.dev]
opt-level = 2
